spring:
  application:
    name: SplitSync


  datasource:
    url: jdbc:postgresql://localhost:5432/splitsync
    username: ehtisham
    password: password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 60000
      max-lifetime: 1800000


  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true


  sql:
    init:
      mode: never
  security:
    oauth2:
          resourceserver:
            jwt:
              issuer-uri: http://localhost:8080/realms/splitsync

app:
  jwt:
    public-key: classpath:keys/public_key.pem
    private-key: classpath:keys/private_key.pem
